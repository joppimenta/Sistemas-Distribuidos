<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento e Controle</title>
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            margin: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .box {
            font-size: 20px;
            font-weight: bold;
            background: #eef;
            padding: 20px;
            border-radius: 10px;
            min-width: 220px;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .box small {
            display: block;
            margin-top: 5px;
            font-size: 14px;
            color: #666;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Monitoramento de Sensores</h2>

    <div class="container">
        <div id="sensor-temperatura" class="box">Temperatura: Aguardando...</div>
        <div id="sensor-luminosidade" class="box">Luminosidade: Aguardando...</div>
    </div>

    <h2>Controle de Atuadores</h2>

    <div class="container">
        <div class="box">
            <h3>Lâmpada</h3>
            <div class="button-container">
                <button onclick="controlarAtuador('lampada', 'ligar')">Ligar</button>
                <button onclick="controlarAtuador('lampada', 'desligar')">Desligar</button>
            </div>
        </div>
    </div>

</body>
</html>
